name: Sohbet
options:
  bundleIdPrefix: com.emre
  deploymentTarget:
    iOS: "16.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "155.0.0"
targets:
  Sohbet:
    type: application
    platform: iOS
    sources:
      - path: Sohbet
    dependencies:
      - package: WebRTC
    scheme: {}
    info:
      path: Sohbet/Info.plist
      properties:
        CFBundleDisplayName: Sohbet
        CFBundleName: Sohbet
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Görüntülü görüşme için kamera gerekiyor.
        NSMicrophoneUsageDescription: Sesli ve görüntülü görüşme için mikrofon gerekiyor.
        NSFaceIDUsageDescription: Sohbeti kilitlemek ve açmak için Face ID kullanılır.
        NSPhotoLibraryAddUsageDescription: Gelen fotoğraf ve videoları galerine kaydedebilmen için.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emre.sohbet
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
